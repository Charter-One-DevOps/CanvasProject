
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{file_form.as_p}}
    <button type="submit" name="action" value="manual">Manual Run</button>

        {% if school %}
        <h1>{{school.name}} blueprint sis ids</h1>
        <ul>
        {% for blueprint in school.blueprint_set.all %}
            <li>{{ blueprint.sis_id }} <button type="submit" name="delete" value="{{ blueprint.sis_id }}">X</button> </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No school</p>
    {% endif %}
    {{id_form.as_p}}
    <button type="submit" name="action" value="id">Add Id</button>

    {{auto_form.as_p}}
    <button type="submit" name="action" value="auto">Automatic Run</button>

</form>
